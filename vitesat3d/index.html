<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/10290311.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sattelite Tracker 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="text-label">
      Satellite Tracker
    </div>
    <div id="date-time"></div>
    <div id="searchContainer">
      <input id="satSearch" type="text" placeholder="Search for a satellite...">
      <button id="searchBtn">Search</button>
    </div>
    <div id="satInfoBox" class="hidden">
      <h3 id="satName">Satellite</h3>
      <p id="satId">NORAD ID: -</p>
      <div class="sat-divider"></div>
      <div class="sat-section-label">IDENTITY</div>
      <p class="sat-row"><span class="sat-label">Status</span><span id="satStatus">-</span></p>
      <p class="sat-row"><span class="sat-label">Type</span><span id="satType">-</span></p>
      <p class="sat-row"><span class="sat-label">Purpose</span><span id="satPurpose">-</span></p>
      <p class="sat-row"><span class="sat-label">Owner</span><span id="satOwner">-</span></p>
      <div class="sat-divider"></div>
      <div class="sat-section-label">LAUNCH</div>
      <p class="sat-row"><span class="sat-label">Date</span><span id="satLaunchDate">-</span></p>
      <p class="sat-row"><span class="sat-label">Site</span><span id="satLaunchSite">-</span></p>
      <div class="sat-divider"></div>
      <div class="sat-section-label">ORBIT</div>
      <p class="sat-row"><span class="sat-label">Period</span><span id="satPeriod">-</span></p>
      <p class="sat-row"><span class="sat-label">Inclination</span><span id="satInclination">-</span></p>
      <p class="sat-row"><span class="sat-label">Apogee</span><span id="satApogee">-</span></p>
      <p class="sat-row"><span class="sat-label">Perigee</span><span id="satPerigee">-</span></p>
    </div>
    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="/src/main.js"></script>
  </body>  
</html>
